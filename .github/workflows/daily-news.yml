name: Daily front page

# 03:30 UTC is 09:00 Indian Standard Time
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build today's edition
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.openai.com/v1' }}
        run: python automation/daily_news.py

      - name: Commit if the edition changed
        run: |
          git config user.name  "clat-final-round-bot"
          git config user.email "bot@clatfinalround.in"
          if [ -n "$(git status --porcelain news)" ]; then
            git add news
            git commit -m "front page: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no change in news/ — nothing to commit"
          fi
